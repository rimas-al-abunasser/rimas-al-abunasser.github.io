<!doctype html>

<head>

<meta property="og:title" content="Rimas Al AbuNasser · ريماس آل أبوناصر">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">

</head>
<body>

<header class="top">
  <a class="brand" href="#" data-act="home" aria-label="Rimas Al AbuNasser">
    <span class="av"><img src="assets/logo.webp" alt=""></span>
    <span class="brand-name" data-t="name">Rimas Al AbuNasser</span>
  </a>
  <ol class="steps" aria-hidden="true">
    <li><i style="--c:#F4C430"></i></li><li><i style="--c:#0B3478"></i></li><li><i style="--c:#12963A"></i></li><li><i style="--c:#E3241B"></i></li><li><i style="--c:#0B3478"></i></li><li><i style="--c:#8C12AE"></i></li><li><i style="--c:#E0DDD5"></i></li>
  </ol>
  <div class="actions">
    <button class="key lang" type="button" data-act="lang" aria-label="العربية">ع</button>
  </div>
</header>

<main class="journey">
  <div class="track">

    <!-- 0 · Intro -->
    <section class="panel intro" style="--ledge:12svh" data-scene="intro">
      <div class="copy">
        <p class="eyebrow" data-t="introEyebrow"></p>
        <h1 class="big" data-h="introTitle"></h1>
        <p class="sub" data-t="introSub"></p>
        <p class="hint"><span data-t="introHint"></span></p>
      </div>
      <div class="chase" aria-hidden="true">
        <img class="c-ctrl" src="assets/ctrl.webp" alt="">
        <img class="c-esc" src="assets/esc.webp" alt="">
      </div>
      <div class="ledge"></div>
    </section>

    <!-- 1 · Sunflower -->
    <section class="panel" style="--ledge:14svh;--accent:#F4C430" data-scene="sun" data-id="s1">
      <div class="copy">
        <span class="key tag"><i class="sw"></i><span data-t="s1key"></span></span>
        <h2 data-t="s1title"></h2>
        <div class="stat"><b data-t="s1stat"></b><small data-t="s1statSub"></small></div>
        <p class="line" data-t="s1line"></p>
        <button class="key more" type="button" data-more="s1"><span data-t="more"></span> ↵</button>
      </div>
      <div class="scene">
        <svg viewBox="0 0 400 300" aria-hidden="true">
          <path d="M40 250 A160 160 0 0 1 360 250" fill="none" stroke="#E0DDD5" stroke-opacity=".22" stroke-width="2" stroke-dasharray="3 9"/>
          <g class="sun-rays"><circle class="sun" r="20" fill="#F4C430"/></g>
          <g transform="translate(150 286)">
            <rect x="-4" y="-52" width="8" height="52" rx="2" fill="#E0DDD5"/>
            <g class="tracker" transform="translate(0 -56)">
              <rect x="-50" y="-8" width="100" height="16" rx="4" fill="#E0DDD5"/>
              <path d="M-25 -8v16M0 -8v16M25 -8v16" stroke="#21314E" stroke-width="2"/>
            </g>
          </g>
          <g class="flower" transform="translate(300 286)">
            <path class="stem" d="M0 0 C 0 -30, 6 -50, 0 -86" stroke="#12963A" stroke-width="5" fill="none" stroke-linecap="round" pathLength="1"/>
            <g class="bloom" transform="translate(0 -92)">
              <g fill="#F4C430">
                <ellipse rx="7" ry="20" transform="rotate(0) translate(0 -18)"/><ellipse rx="7" ry="20" transform="rotate(30) translate(0 -18)"/><ellipse rx="7" ry="20" transform="rotate(60) translate(0 -18)"/><ellipse rx="7" ry="20" transform="rotate(90) translate(0 -18)"/><ellipse rx="7" ry="20" transform="rotate(120) translate(0 -18)"/><ellipse rx="7" ry="20" transform="rotate(150) translate(0 -18)"/><ellipse rx="7" ry="20" transform="rotate(180) translate(0 -18)"/><ellipse rx="7" ry="20" transform="rotate(210) translate(0 -18)"/><ellipse rx="7" ry="20" transform="rotate(240) translate(0 -18)"/><ellipse rx="7" ry="20" transform="rotate(270) translate(0 -18)"/><ellipse rx="7" ry="20" transform="rotate(300) translate(0 -18)"/><ellipse rx="7" ry="20" transform="rotate(330) translate(0 -18)"/>
              </g>
              <circle r="14" fill="#5A3A12"/>
            </g>
          </g>
        </svg>
      </div>
      <img class="host" src="assets/f2.webp" alt="">
      <div class="ledge"></div>
    </section>

    <!-- 2 · Product -->
    <section class="panel" style="--ledge:17svh;--accent:#0B3478" data-scene="board" data-id="s2">
      <div class="copy">
        <span class="key tag"><i class="sw"></i><span data-t="s2key"></span></span>
        <h2 data-t="s2title"></h2>
        <div class="stat"><b data-t="s2stat"></b><small data-t="s2statSub"></small></div>
        <div class="stat"><b data-t="s2stat2"></b><small data-t="s2stat2Sub"></small></div>
        <p class="line" data-t="s2line"></p>
        <button class="key more" type="button" data-more="s2"><span data-t="more"></span> ↵</button>
      </div>
      <div class="scene">
        <svg viewBox="0 0 400 300" aria-hidden="true">
          <g font-family="IBM Plex Mono, IBM Plex Sans Arabic, monospace" font-size="12" fill="#A9B1C2" text-anchor="middle">
            <text x="70" y="40" data-t="todo"></text><text x="200" y="40" data-t="doing"></text><text x="330" y="40" data-t="done"></text>
          </g>
          <path d="M135 52v220M265 52v220" stroke="#E0DDD5" stroke-opacity=".15" stroke-width="2" stroke-dasharray="4 6"/>
          <g class="cards"></g>
        </svg>
      </div>
      <img class="host" src="assets/ctrl.webp" alt="">
      <img class="host host2" src="assets/space.webp" alt="">
      <div class="ledge"></div>
    </section>

    <!-- 3 · Rewaa -->
    <section class="panel" style="--ledge:20svh;--accent:#12963A" data-scene="rewaa" data-id="s3">
      <div class="copy">
        <span class="key tag"><i class="sw"></i><span data-t="s3key"></span></span>
        <h2 class="name"><span data-t="s3title"></span><small data-t="s3titleSub"></small></h2>
        <div class="stat"><b data-t="s3stat"></b><small data-t="s3statSub"></small></div>
        <p class="line" data-t="s3line"></p>
        <button class="key more" type="button" data-more="s3"><span data-t="more"></span> ↵</button>
      </div>
      <div class="scene">
        <svg viewBox="0 0 400 300" aria-hidden="true">
          <g class="waves" fill="none" stroke="#E0DDD5" stroke-width="3" stroke-linecap="round">
            <path d="M92 118a22 22 0 0 1 0 30"/><path d="M102 106a38 38 0 0 1 0 54"/><path d="M112 94a54 54 0 0 1 0 78"/>
          </g>
          <rect x="64" y="120" width="16" height="140" rx="3" fill="#E0DDD5"/>
          <rect x="56" y="108" width="32" height="26" rx="6" fill="#E0DDD5"/>
          <circle cx="72" cy="121" r="5" fill="#12963A"/>
          <g class="drops" fill="#7FB8E6"></g>
          <rect class="soil" x="20" y="258" width="360" height="30" rx="8" fill="#6B675F"/>
          <g class="sprouts" stroke="#12963A" stroke-width="4" stroke-linecap="round" fill="none"></g>
        </svg>
      </div>
      <img class="host" src="assets/enter.webp" alt="">
      <div class="ledge"></div>
    </section>

    <!-- 4 · People -->
    <section class="panel" style="--ledge:17svh;--accent:#E3241B" data-scene="people" data-id="s4">
      <div class="copy">
        <span class="key tag"><i class="sw"></i><span data-t="s4key"></span></span>
        <h2 data-t="s4title"></h2>
        <ul class="nums">
          <li><b data-count="69">69</b><span data-t="s4l1"></span></li>
          <li><b data-count="71">71</b><span data-t="s4l2"></span></li>
          <li><b data-count="80">80</b><span data-t="s4l3"></span></li>
          <li><b data-count="80">80</b><span data-t="s4l4"></span></li>
        </ul>
        <button class="key more" type="button" data-more="s4"><span data-t="more"></span> ↵</button>
      </div>
      <div class="scene">
        <svg viewBox="0 0 400 300" aria-hidden="true"><g class="dots"></g></svg>
      </div>
      <img class="host" src="assets/space.webp" alt="">
      <div class="ledge"></div>
    </section>

    <!-- 5 · Burhan -->
    <section class="panel" style="--ledge:14svh;--accent:#0B3478" data-scene="burhan" data-id="s5">
      <div class="copy">
        <span class="key tag"><i class="sw"></i><span data-t="s5key"></span></span>
        <h2 class="name"><span data-t="s5title"></span><small data-t="s5titleSub"></small></h2>
        <div class="stat"><b data-t="s5stat"></b><small data-t="s5statSub"></small></div>
        <p class="line" data-t="s5line"></p>
        <button class="key more" type="button" data-more="s5"><span data-t="more"></span> ↵</button>
      </div>
      <div class="scene">
        <svg viewBox="0 0 400 300" aria-hidden="true">
          <rect class="doc" x="110" y="40" width="180" height="230" rx="14" fill="#E0DDD5"/>
          <g class="rules"></g>
          <g class="srcs" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="500">
            <g transform="translate(300 70)"><rect width="36" height="22" rx="5" fill="#F4C430"/><text x="18" y="15" text-anchor="middle" fill="#21314E">S1</text></g>
            <g transform="translate(300 100)"><rect width="36" height="22" rx="5" fill="#F4C430"/><text x="18" y="15" text-anchor="middle" fill="#21314E">S2</text></g>
          </g>
          <g class="shield" transform="translate(200 216)">
            <path d="M0 -34 L28 -24 V0 C28 18 14 28 0 34 C-14 28 -28 18 -28 0 V-24 Z" fill="#0B3478"/>
            <path d="M-11 0 L-3 8 L12 -9" fill="none" stroke="#E0DDD5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
      </div>
      <img class="host" src="assets/ctrl.webp" alt="">
      <div class="ledge"></div>
    </section>

    <!-- 6 · RoadScan -->
    <section class="panel" style="--ledge:17svh;--accent:#8C12AE" data-scene="road" data-id="s6">
      <div class="copy">
        <span class="key tag"><i class="sw"></i><span data-t="s6key"></span></span>
        <h2 class="name"><span data-t="s6title"></span><small data-t="s6titleSub"></small></h2>
        <div class="stat"><b data-t="s6stat"></b><small data-t="s6statSub"></small></div>
        <p class="line" data-t="s6line"></p>
        <button class="key more" type="button" data-more="s6"><span data-t="more"></span> ↵</button>
      </div>
      <div class="scene">
        <svg viewBox="0 0 400 300" aria-hidden="true">
          <path d="M150 30 L250 30 L380 290 L20 290 Z" fill="#172339"/>
          <path d="M200 40 V290" stroke="#E0DDD5" stroke-width="4" stroke-dasharray="16 16" opacity=".55"/>
          <g fill="none" stroke="#E0DDD5" stroke-width="2.4" stroke-linecap="round" opacity=".85">
            <path d="M120 230 l14 -8 l10 6 l16 -10"/><path d="M262 150 l-6 18 l8 12 l-4 16"/><path d="M178 92 l18 4 l12 -6"/><path d="M286 252 l20 6 l14 -4 l10 8"/>
          </g>
          <g class="boxes" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="500"></g>
          <g class="prio" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="500"></g>
        </svg>
      </div>
      <img class="host" src="assets/esc.webp" alt="">
      <div class="ledge"></div>
    </section>

    <!-- 7 · Finale -->
    <section class="panel finale" style="--ledge:11svh" data-scene="finale">
      <div class="copy">
        <h2 data-t="finTitle"></h2>
        <p class="role" data-t="finRole"></p>
        <p class="looking" data-t="finLooking"></p>
        <p class="where" data-t="finWhere"></p>
        <div class="cta">
          <a class="key go" data-mail href="#"><span data-t="finEmail"></span> ↵</a>
          <a class="key" data-linkedin href="#" target="_blank" rel="noopener"><span data-t="finLinkedin"></span></a>
          <button class="key" type="button" data-act="home"><span data-t="finReplay"></span></button>
        </div>
        <p class="mail-text" data-mailtext></p>
      </div>
      <div class="logo-stage">
        <canvas class="parts" aria-hidden="true"></canvas>
        <img class="logo-final" src="assets/logo.webp" alt="Rimas logo">
      </div>
      <div class="ledge"></div>
    </section>

  </div>
</main>

<!-- Details -->
<dialog class="more-dlg" id="more">
  <div class="m-head"><h3></h3><button class="key" type="button" data-act="close-more">Esc</button></div>
  <ul class="m-list"></ul>
  <div class="m-tags"></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="content.js"></script>

<script src="app.js"></script>
